services:
    pgsql:
        image: postgres:16-alpine
        container_name: expediente-clinico
        restart: unless-stopped
        environment:
            POSTGRES_DB: expediente-clinico-db
            POSTGRES_USER: adminrvzorblvde
            POSTGRES_PASSWORD: secret
        ports:
            - "5432:5432"
        volumes:
            - "pgsql-data:/var/lib/postgresql/data"

volumes:
    pgsql-data:
